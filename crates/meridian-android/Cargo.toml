[package]
name = "meridian-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Meridian's Android entry: NativeActivity's android_main starts the game (libmeridian.so)"
publish = false

[lib]
name = "meridian"
crate-type = ["cdylib"]

# Android only: on other targets this builds an empty library. No `controllers` feature (gilrs and
# hidapi have no Android backend); phone gamepads go through horizon-client-render's android_gamepad.
[target.'cfg(target_os = "android")'.dependencies]
horizon-game = { path = "../horizon-game", default-features = false, features = ["audio", "horizon-extras"] }
horizon-client = { path = "../horizon-client", default-features = false }
horizon-guest-stack = { path = "../horizon-guest-stack" }
winit = { version = "0.30.13", features = ["android-native-activity"] }

[lints]
workspace = true
