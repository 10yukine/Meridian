[package]
name = "meridian-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
getrandom = "0.3"
png = "0.18"
horizon-mod-package = { path = "../horizon-mod-package", features = ["index"] }
horizon-prepare = { path = "../horizon-prepare" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[lints]
workspace = true

[target.'cfg(all(target_os = "android", target_arch = "aarch64"))'.dependencies]
libc = "0.2"
xz4rust = { version = "0.2.3", default-features = false, features = ["std", "crc64"] }
tar = { version = "0.4", default-features = false }
